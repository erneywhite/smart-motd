# smart-motd example config (sourced by bash; do NOT add executable code)
# Edit then `sudo smart-motd update-cache` and `smart-motd show` to preview.

# ---- Theme ----
THEME='classic'                  # classic | slim | heavy | double | dotted | ascii |
                                 # arrows | stars | wave | block | pipes | retro |
                                 # compact | chevrons | bullets | cross | plus |
                                 # cosmic | sharp | zen | custom
COLOR_THEME='default'            # default | ocean | forest | sunset | amber | mono |
                                 # matrix | neon | coral | mint | sky | gold | snow
# THEME_KV_SEPARATOR=':'         # only used when THEME='custom'
# THEME_BANNER_CHAR='='          # only used when THEME='custom'
# THEME_DIVIDER_CHAR='-'         # only used when THEME='custom'
# THEME_HEADING_STYLE='centered' # centered | left | bracketed (only for THEME='custom')

# ---- Header ----
HEADER_TEXT='Welcome'
HEADER_SPACED=true        # render letters with spaces between them

# ---- Welcome ----
WELCOME_TITLE=''          # e.g. 'web-01 (production)'
WELCOME_LINES=()          # e.g. ('Web|https://example.com' 'Admin|admin@example.com')

# ---- Warning ----
WARNING_LINES=(
    'Authorized access only!'
    'All connections are logged and monitored.'
    'Unauthorized use may be subject to criminal prosecution.'
)

# ---- System status ----
SYSTEM_DISK_PATHS=('/')   # which mountpoints to display

# ---- Services ----
SERVICES_LIST=()          # systemd unit names to monitor, e.g. ('nginx' 'postgresql')
SERVICES_SHOW_FAILED=false  # also auto-show any unit in 'failed' state — catches
                            # crashes of services that weren't on the explicit list

# ---- Network ----
NETWORK_SHOW_PUBLIC_IP=true     # query api.ipify.org (cached 5 min)
NETWORK_SHOW_INTERFACES=true    # list each interface's IPv4 address
NETWORK_SHOW_RATES=true         # append rx/tx byte rate (5-min avg) next to each IP
NETWORK_INTERFACES=()           # empty = all non-loopback; otherwise only listed
                                # ones, e.g. ('eth0' 'wg0')

# ---- SSL ----
SSL_CERT_PATHS=()         # absolute paths to PEM/CRT files the wizard's
                          # auto-detect picked up. Sources scanned: Let's
                          # Encrypt (/etc/letsencrypt), control panels
                          # (aaPanel, ISPmanager, FastPanel, HestiaCP,
                          # Plesk, cPanel) and ssl_certificate /
                          # SSLCertificateFile in nginx / apache configs.
                          # Re-run motd-setup to refresh detection.
SSL_DOMAINS=()            # extra checks beyond the auto-detect list:
                          #   'example.com'              (remote 443)
                          #   'example.com:8443'         (remote custom port)
                          #   '/path/to/cert.pem'        (local PEM file)
SSL_WARN_DAYS=14
# SSL_AUTODISCOVER_LETSENCRYPT=true   # legacy (pre-v1.12.1). Replaced by
                                      # SSL_CERT_PATHS auto-detect above.
                                      # Still honored as a fallback when
                                      # SSL_CERT_PATHS is empty (so an
                                      # un-migrated config keeps monitoring
                                      # /etc/letsencrypt). Re-run motd-setup
                                      # to migrate explicitly.

# ---- Containers ----
DOCKER_FILTER=''          # optional regex to filter container names

# ---- Directories ----
DIRECTORIES_LIST=()       # Each entry is 'Label|Path' or 'Label|Path|backup'.
                          # backup-flagged entries additionally show the age
                          # of the newest file inside the directory.
                          # Examples:
                          #   ('PG data|/var/lib/postgresql'
                          #    'Backups|/srv/backups|backup'
                          #    'DB dumps|/srv/db-dumps|backup')

# ---- Last logins ----
LASTLOGIN_COUNT=3

# ---- Weather ----
WEATHER_CITY=''           # blank = auto-detect by IP

# ---- Telegram SSH login alerts ----
# Sends a Telegram message on every successful SSH login. The bot token,
# chat ID and thread ID live in /etc/smart-motd/secrets.conf (mode 0600,
# root-only) — NOT here, so this file stays world-readable without
# leaking credentials.
TELEGRAM_ALERTS_LANG='en'  # 'en' or 'ru' — independent from wizard language
TELEGRAM_ALERTS_IP_WHITELIST=()   # IPs/CIDRs that DON'T trigger an alert,
                                  # e.g. ('203.0.113.5' '192.168.1.0/24')
TELEGRAM_RECAP_ENABLED=false      # daily summary message (24h logins, updates,
                                  # reboot status). Off by default.
TELEGRAM_RECAP_HOUR=9             # hour-of-day (0-23, server's TZ) to fire

# ---- Colors ----
COLORS_ENABLED=true

# ---- Section toggles ----
# Use true / false / auto. "auto" = enabled when the prerequisite is detected.
HEADER_ENABLED=true
WELCOME_ENABLED=true
WARNING_ENABLED=true
SYSTEM_ENABLED=true
MAINTENANCE_ENABLED=true
UPDATES_ENABLED=true
SERVICES_ENABLED=false
NETWORK_ENABLED=true
SSL_ENABLED=true
SECURITY_ENABLED=true
TEMPERATURE_ENABLED=auto
SMART_ENABLED=auto
DOCKER_ENABLED=auto
PODMAN_ENABLED=auto
KUBERNETES_ENABLED=auto
DIRECTORIES_ENABLED=false
LASTLOGIN_ENABLED=true
WEATHER_ENABLED=false
TELEGRAM_ALERTS_ENABLED=false
# Note: UPGRADE_NOTICE is a system parameter — always on. The motd-generate
# script forces UPGRADE_NOTICE_ENABLED=true at runtime regardless of what's
# in this file, so security-relevant smart-motd updates always surface.
FOOTER_ENABLED=true
